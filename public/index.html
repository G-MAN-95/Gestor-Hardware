<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Hardware</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Gestor de Hardware</h1>
    <p>Inventario de equipos</p>
  </header>

  <main>
    <section class="tarjeta">
      <h2 id="titulo-form">Registrar equipo</h2>
      <div id="mensajes"></div>
      <form id="formulario">
        <input type="hidden" id="id">
        <div class="fila">
          <label>Nombre del equipo <input id="nombre" placeholder="Laptop de contabilidad" required></label>
          <label>Categoría
            <select id="categoria" required>
              <option value="">Selecciona...</option>
              <option>Computadora</option>
              <option>Laptop</option>
              <option>Monitor</option>
              <option>Impresora</option>
              <option>Redes</option>
              <option>Almacenamiento</option>
              <option>Periférico</option>
              <option>Otro</option>
            </select>
          </label>
        </div>
        <div class="fila">
          <label>Marca <input id="marca" placeholder="Dell" required></label>
          <label>Modelo <input id="modelo" placeholder="Latitude 5420" required></label>
        </div>
        <div class="fila">
          <label>Número de serie <input id="numeroSerie" placeholder="SN-ABC12345" required></label>
          <label>Estado
            <select id="estado" required>
              <option>Operativo</option>
              <option>En reparación</option>
              <option>Dado de baja</option>
            </select>
          </label>
          <label>Fecha de compra <input id="fechaCompra" type="date" required></label>
        </div>
        <div class="botones">
          <button type="submit">Guardar</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Equipos registrados</h2>
      <input id="buscador" class="buscador" type="search" placeholder="Buscar por nombre, marca, modelo, n.º de serie, categoría o estado...">
      <table>
        <thead>
          <tr>
            <th>N.º de serie</th>
            <th>Equipo</th>
            <th>Marca / Modelo</th>
            <th>Categoría</th>
            <th>Estado</th>
            <th>Compra</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
      <p id="vacio" hidden>No hay equipos registrados.</p>
    </section>
  </main>

  <script src="fechas.js"></script>
  <script src="mensajes.js"></script>
  <script src="app.js"></script>
  <script src="busqueda.js"></script>
</body>
</html>
